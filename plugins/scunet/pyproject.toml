[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-s-plugin-scunet"
version = "0.1.0"
description = "PhotoS official SCUNet strong-denoise plugin (ONNX via onnxruntime)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"  # SPDX expression (setuptools>=77)
dependencies = [
    "photo-s-tools>=1.0.0",
    "onnxruntime>=1.16.0",
]

[project.entry-points."photo_s.plugins"]
scunet = "photo_s_plugin_scunet:ScunetPlugin"

[tool.setuptools.packages.find]
include = ["photo_s_plugin_scunet*"]
