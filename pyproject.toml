[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-s-tools"
version = "2.4.0"
description = "批量照片处理工具箱：压缩/转换/调色/EXIF/RAW/去重/选片/REST+MCP — Batch photo toolkit: compress, convert, grade, EXIF, RAW, dedup, cull (CLI + GUI + REST + MCP)"
readme = "docs/README.en.md"  # README.md 是中文（GitHub 优先展示）；PyPI 保持英文
requires-python = ">=3.9"
license = "MIT"  # SPDX expression (setuptools>=77)
authors = [
    {name = "PhotoS Contributors"}
]
keywords = ["image", "compression", "photo", "batch", "RAW", "JPEG", "WebP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.4.0",  # get_flattened_data (getdata is removed in Pillow 14)
    "tomli>=2.0; python_version < '3.11'",
    "rawpy>=0.18.0",  # RAW decode is core for a photo tool (wheels on all platforms)
]

[project.optional-dependencies]
raw = []  # kept as a no-op extra: rawpy is now a core dependency
exif = ["piexif>=1.1.3"]
watch = ["watchdog>=3.0.0"]
gui = ["tkinterdnd2>=0.3.0"]
heic = ["pillow-heif>=0.5.0"]
avif = ["pillow-avif-plugin>=1.0"]
enhance = ["opencv-python-headless>=4.6.0"]  # NLM denoise + auto-straighten
tiff16 = ["tifffile>=2024.0"]  # 16-bit RAW → TIFF output (--raw-16bit)
mcp = ["mcp>=1.20,<2; python_version >= '3.10'"]  # MCP server for AI agents (requires Python >= 3.10)
all = ["piexif>=1.1.3", "watchdog>=3.0.0", "pillow-heif>=0.5.0", "pillow-avif-plugin>=1.0", "tkinterdnd2>=0.3.0", "opencv-python-headless>=4.6.0", "tifffile>=2024.0", "mcp>=1.20,<2; python_version >= '3.10'"]

[project.scripts]
photo-s = "photo_s.cli:main"

[tool.setuptools.packages.find]
include = ["photo_s*"]
