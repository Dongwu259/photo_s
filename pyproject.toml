[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-s-tools"
version = "1.8.0"
description = "批量图片压缩与格式转换工具 — Batch Image Compression & Format Conversion (CLI + GUI)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"  # SPDX expression (setuptools>=77)
authors = [
    {name = "PhotoS Contributors"}
]
keywords = ["image", "compression", "photo", "batch", "RAW", "JPEG", "WebP"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.4.0",  # get_flattened_data (getdata is removed in Pillow 14)
    "tomli>=2.0; python_version < '3.11'",
    "rawpy>=0.18.0",  # RAW decode is core for a photo tool (wheels on all platforms)
]

[project.optional-dependencies]
raw = []  # kept as a no-op extra: rawpy is now a core dependency
exif = ["piexif>=1.1.3"]
watch = ["watchdog>=3.0.0"]
gui = ["tkinterdnd2>=0.3.0"]
heic = ["pillow-heif>=0.5.0"]
avif = ["pillow-avif-plugin>=1.0"]
enhance = ["opencv-python-headless>=4.6.0"]  # NLM denoise + auto-straighten
mcp = ["mcp>=1.20,<2; python_version >= '3.10'"]  # MCP server for AI agents (requires Python >= 3.10)
all = ["piexif>=1.1.3", "watchdog>=3.0.0", "pillow-heif>=0.5.0", "pillow-avif-plugin>=1.0", "tkinterdnd2>=0.3.0", "opencv-python-headless>=4.6.0", "mcp>=1.20,<2; python_version >= '3.10'"]

[project.scripts]
photo-s = "photo_s.cli:main"

[tool.setuptools.packages.find]
include = ["photo_s*"]
