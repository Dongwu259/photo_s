name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[all]"
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: GUI smoke (headless)
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a python - <<'EOF'
          import tkinter as tk
          from photo_s import gui
          root = tk.Tk()
          app = gui.PhotoSApp(root)
          app.root.update_idletasks()
          app._build_options()
          root.destroy()
          print("GUI smoke OK")
          EOF

  bundle:
    name: Bundle (Windows exe)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with optional features)
        run: |
          pip install ".[all]"
          pip install pyinstaller
      - name: Build bundle
        run: python packaging/build.py
      - name: Smoke test the exe
        run: |
          .\dist\photo-s\photo-s.exe --help | Select-Object -First 3
      - uses: actions/upload-artifact@v4
        with:
          name: photo-s-windows
          path: dist/photo-s/
