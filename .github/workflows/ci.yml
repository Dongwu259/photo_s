name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          pip install -e ".[all]"
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: GUI smoke (headless)
        if: matrix.python-version == '3.11'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a python - <<'EOF'
          import tkinter as tk
          from photo_s import gui
          root = tk.Tk()
          app = gui.PhotoSApp(root)
          app.root.update_idletasks()
          app._build_options()
          root.destroy()
          print("GUI smoke OK")
          EOF

  plugin-test:
    name: Plugin test (SCUNet, real inference)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core + SCUNet plugin + onnx
        run: |
          pip install -e ".[all]"
          pip install -e plugins/scunet   # brings onnxruntime via its deps
          pip install onnx pytest          # onnx → importorskip no longer skips
      - name: Run FULL suite with plugin installed
        # The editable plugin is installed so tests/test_scunet_plugin.py runs
        # real onnxruntime inference (not skipped). Running the full suite also
        # proves the installed plugin doesn't break other tests (they are
        # hermetic against discover_plugins).
        run: python -m pytest tests/ -q

  test-windows:
    name: Tests on Windows (real Tk, full suite + plugin)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install ".[all]"
          pip install -e plugins/scunet
          pip install onnx pytest
      - name: Run tests
        env:
          PYTHONIOENCODING: utf-8
        run: python -m pytest tests/ -q
        # Windows runners have a desktop session, so the Tk GUI tests
        # execute for real here (they skip headless on Linux) — this is
        # the main Windows-verification path for the GUI.

  bundle:
    name: Bundle (Windows exe)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with optional features)
        run: |
          pip install ".[all]"
          pip install pyinstaller
      - name: Build bundle
        run: python packaging/build.py
      - name: Smoke test the exe
        run: |
          .\dist\photo-s\photo-s.exe --help | Select-Object -First 3
      - uses: actions/upload-artifact@v4
        with:
          name: photo-s-windows
          path: dist/photo-s/
      - name: Build lite bundle (CLI + MCP, no GUI)
        run: python packaging/build.py --lite
      - name: Smoke test the lite exe
        run: |
          # pwsh 7.4+ turns native non-zero exits into terminating errors;
          # restore legacy semantics so the exit-1 assertion below can run.
          $PSNativeCommandUseErrorActionPreference = $false
          .\dist\photo-s-lite\photo-s-lite.exe --help | Select-Object -First 3
          .\dist\photo-s-lite\photo-s-lite.exe --version
          # lite has no GUI: the gui command must fail gracefully (exit 1)
          .\dist\photo-s-lite\photo-s-lite.exe gui
          if ($LASTEXITCODE -ne 1) { throw "lite gui should exit 1" }
      - uses: actions/upload-artifact@v4
        with:
          name: photo-s-lite-windows
          path: dist/photo-s-lite/
