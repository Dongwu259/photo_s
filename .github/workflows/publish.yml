name: Publish to PyPI

# 发布到 PyPI（Trusted Publishing，无需密码/token 明文）
#
# 两个 PyPI 项目共用本 workflow（同一个 environment: pypi）：
#   · photo-s-tools           —— tag v*          （core）
#   · photo-s-plugin-scunet   —— tag scunet-v*   （plugins/scunet/ 下构建）
#
# 每个 PyPI 项目都需要在自己的 Publishing 设置里登记 trusted publisher：
#   仓库 Dongwu259/photo_s, workflow publish.yml, environment pypi
#
# 打 tag 即触发：
#   git tag v1.1.0 && git push origin v1.1.0
#   git tag scunet-v0.2.0 && git push origin scunet-v0.2.0
#
# 完整发布清单见 docs/RELEASE.md。

on:
  push:
    tags: ["v*", "scunet-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: 'Which distribution to publish'
        required: true
        type: choice
        default: core
        options: [core, plugin]

permissions:
  id-token: write  # 用于 trusted publishing
  contents: read

jobs:
  publish:
    name: Build wheel & publish (core)
    if: (github.event_name == 'workflow_dispatch' && inputs.target == 'core') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-plugin:
    name: Build wheel & publish (plugin)
    if: (github.event_name == 'workflow_dispatch' && inputs.target == 'plugin') || startsWith(github.ref, 'refs/tags/scunet-v')
    runs-on: ubuntu-latest
    environment: pypi
    defaults:
      run:
        working-directory: plugins/scunet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          pip install build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: plugins/scunet/dist
