# LLaMA-Factory LoRA 配置 —— 模型 B：小 VLM 全功能调色（数据 1000+ 后）
#
# 用法（5080-16GB）：
#   pip install llamafactory
#   # 1. 数据转换：lr_records.jsonl → sharegpt 格式（images + conversations）
#   #    assistant 文本 = options 的紧凑字符串（exposure=0.4,contrast=1.26,hsl=...;masks=...）
#   # 2. 注册 dataset 到 data/dataset_info.json
#   llamafactory-cli train tools/llama_factory_lora.yaml
#
# 基座：MiniCPM-V 4.6（1.3B，Apache 2.0）——16GB QLoRA batch 8 无压力；
# 换 Qwen3-VL-3B 时改 model_name_or_path + template 并按需降 batch。

model_name_or_path: openbmb/MiniCPM-V-4.6
stage: sft
finetuning_type: lora
dataset: photo_s_tone
template: minicpm-v
cutoff_len: 2048
learning_rate: 1.0e-4
num_train_epochs: 5.0
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
optim: adamw_torch
lr_scheduler_type: cosine
warmup_ratio: 0.05
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
quantization_bit: 4
bf16: true
output_dir: outputs/photo_s_tone
logging_steps: 10
save_steps: 200
plot_loss: true
